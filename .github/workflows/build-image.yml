name: Build code-server image (Docker Hub)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub 仓库名：用户名取自仓库 Secret，避免硬编码
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/code-server

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析 code-server 版本与构建日期
        id: ver
        run: |
          CODE_RELEASE=$(curl -sX GET https://api.github.com/repos/coder/code-server/releases/latest \
            | jq -r '.tag_name' | sed 's|^v||')
          if [ -z "${CODE_RELEASE}" ] || [ "${CODE_RELEASE}" = "null" ]; then
            echo "无法获取 code-server 最新版本" >&2
            exit 1
          fi
          echo "code_release=${CODE_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 用 Dockerfile；若目标机器是 arm64，改用 Dockerfile.aarch64 并把 platforms 换成 linux/arm64
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.code_release }}
          build-args: |
            BUILD_DATE=${{ steps.ver.outputs.build_date }}
            VERSION=${{ steps.ver.outputs.code_release }}
            CODE_RELEASE=${{ steps.ver.outputs.code_release }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
